name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # The suite is offline: provider-backed evaluation tests are skipped
      # unless their credentials are present.
      - name: Test
        run: pnpm test

      # Placeholder values only. The build must not need real credentials;
      # these keep module-level configuration checks from failing if a route
      # is evaluated while collecting page data.
      - name: Build
        run: pnpm build
        env:
          OPENROUTER_API_KEY: ci-placeholder
          E2B_API_KEY: ci-placeholder
          DATABASE_HOST: localhost
          DATABASE_USER: ci
          DATABASE_PASSWORD: ci-placeholder
          SESSION_SIGNING_SECRET: ci-placeholder-session-signing-secret

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reported but not yet blocking: the dependency upgrades that clear the
    # current high and critical advisories have not been done. Remove
    # continue-on-error once they are.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm audit --prod --audit-level high
